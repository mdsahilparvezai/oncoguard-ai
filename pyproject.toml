[project]
name = "oncoguard-ai"
version = "0.1.0"
description = "ONCOGUARD AI - Breast Cancer Research Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scikit-learn==1.5.1",
    "scipy==1.13.1",
    "joblib==1.4.2",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "shap==0.45.0",
    "plotly==5.23.0",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "streamlit==1.38.0",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    "tqdm==4.66.5",
    "openai==1.40.3",
    "httpx==0.27.2",
    "sentence-transformers==3.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-mock==3.14.0",
    "ruff==0.6.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "T20"]
ignore = ["E501", "B008"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"